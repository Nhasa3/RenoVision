<!DOCTYPE html>
<html>
    <head>
        <title>Kitechen Renivation</title>
        <link rel="stylesheet" href="{static 'css/form.css' %}">
        <link rel="stylesheet" {% static href="{'css/header.css'}" %}>
        <style>
                        #slideshow {
                position: relative;
                width: 100%;
                height: 500px;
                overflow: hidden;
            }

            #slideshow img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            /* Arrow button */
            .next-arrow {
                position: absolute;
                right: 15px;
                top: 50%;
                transform: translateY(-50%);

                width: 50px;
                height: 50px;

                border: none;
                border-radius: 50%;
                cursor: pointer;

                font-size: 28px;
                line-height: 50px;
                text-align: center;

                background: rgba(0, 0, 0, 0.4);
                color: white;

                transition: background 0.2s ease;
            }

            .next-arrow:hover {
                background: rgba(0, 0, 0, 0.7);
            }
        </style>
    </head>
    <body>
        {% include "../partials/header.html" %}
        <div id="slideshow">
            <img id="slideImages" src="{% static 'resources/kitchen.jpg' %}">
            <button class="next-arrow" onclick="nextPhoto()">></button>
        </div>

        <div>
        {% include "../partials/form.html" %}
        </div>

        <script>
            const images = [
            "{% static 'resources/basement.jpg' %}",
            "{% static 'resources/kitchen.jpg' %}",
            "{% static 'resources/tv.jpg' %}"
            ];
            let current = 0;
            function nextPhoto(){
                current = (current + 1) % images.length;
                document.getElementById("slideImages").src = images[current];
            }
            setInterval(nextPhoto, 5000);
        </script>

    </body>
</html>
