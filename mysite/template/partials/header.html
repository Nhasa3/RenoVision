{% load static %}

{% load static %}

<header class="header" id="header">

    <a href="{% url 'web:index' %}" class="logo">
        <img src="{% static 'resources/lgo.png' %}" alt="RenoVision Logo" class="header-logo">
    </a>


    <button class="menu-toggle" id="menuToggle">
        <span></span>
        <span></span>
        <span></span>
    </button>


    <nav class="route" id="navMenu">

        <a href="{% url 'web:index' %}">
            Home
        </a>


        <div class="dropdown">

            <button class="dropbtn">
                Services
            </button>


            <div class="dropdown-content">

                <a href="{% url 'web:basement' %}">
                    Basement Renovation
                </a>

                <a href="{% url 'web:kitchen' %}">
                    Kitchen Renovation
                </a>

                <a href="{% url 'web:bathroom' %}">
                    Bathroom Renovation
                </a>

                <a href="{% url 'web:tv' %}">
                    TV Feature Wall
                </a>

                <a href="{% url 'web:interlock' %}">
                    Interlock
                </a>

            </div>

        </div>


        <a href="{% url 'web:gallery' %}">
            Gallery
        </a>


        <a href="{% url 'web:about' %}">
            About
        </a>


    </nav>

</header>
<script>

const menu = document.getElementById("navMenu");
const toggle = document.getElementById("menuToggle");
const services = document.getElementById("servicesBtn");
const header = document.getElementById("header");

// Mobile menu
toggle.addEventListener("click", () => {

    menu.classList.toggle("active");

    toggle.innerHTML =
        menu.classList.contains("active")
            ? "&times;"
            : "☰";

});

// Mobile services dropdown
services.addEventListener("click", function (e) {

    if (window.innerWidth <= 768) {

        e.preventDefault();
        e.stopPropagation();

        this.parentElement.classList.toggle("active");

    }

});

document.addEventListener("click", function (e) {

    if (window.innerWidth <= 768 &&
        !e.target.closest(".dropdown")) {

        document
            .querySelector(".dropdown")
            .classList.remove("active");

    }

});

// Hide header when scrolling down
let lastScroll = 0;

window.addEventListener("scroll", () => {

    const current = window.pageYOffset;

    if (current > lastScroll && current > 80) {

        header.classList.add("hide");

    } else {

        header.classList.remove("hide");

    }

    lastScroll = current;

});

</script>
