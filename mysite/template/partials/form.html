<div class="form-container">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <h2>Request a Free Quote</h2>
        <p>
            Tell us about your renovation project and we'll contact you
            with an estimate or schedule a site visit.
        </p>

        <!-- Contact Information -->
        <div class="form-group">
            <label for="fullname">Full Name *</label>
            <input
                type="text"
                id="fullname"
                name="fullname"
                class="form-control"
                placeholder="John Smith"
                required
            >
        </div>

        <div class="form-group">
            <label for="phone">Phone Number *</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                class="form-control"
                placeholder="(555) 123-4567"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">Email Address *</label>
            <input
                type="email"
                id="email"
                name="email"
                class="form-control"
                placeholder="john@example.com"
                required
            >
        </div>

        <!-- Property Information -->
        <div class="form-group">
            <label for="address">Project Address *</label>
            <input
                type="text"
                id="address"
                name="address"
                class="form-control"
                placeholder="123 Main Street"
                required
            >
        </div>

        <div class="form-group">
            <label for="city">City *</label>
            <input
                type="text"
                id="city"
                name="city"
                class="form-control"
                placeholder="Ottawa"
                required
            >
        </div>

        <div class="form-group">
            <label for="postal_code">Postal Code *</label>
            <input
                type="text"
                id="postal_code"
                name="postal_code"
                class="form-control"
                placeholder="K1A 0A6"
                required
            >
        </div>

        <!-- Project Details -->
        <div class="form-group">
            <label for="project_type">Project Type *</label>
            <select
                id="project_type"
                name="project_type"
                class="form-control"
                required
            >
                <option value="">Select a project type</option>
                <option>Basement Renovation</option>
                <option>Kitchen Renovation</option>
                <option>Bathroom Renovation</option>
                <option>Flooring</option>
                <option>Painting</option>
                <option>Home Addition</option>
                <option>Full Home Renovation</option>
                <option>Other</option>
            </select>
        </div>

        <div class="form-group">
            <label for="basement_status">Basement Status</label>
            <select
                id="basement_status"
                name="basement_status"
                class="form-control"
            >
                <option value="">Not Applicable</option>
                <option>Unfinished Basement</option>
                <option>Partially Finished Basement</option>
                <option>Finished Basement Remodel</option>
            </select>
        </div>

        <div class="form-group">
            <label for="budget">Estimated Budget</label>
            <select
                id="budget"
                name="budget"
                class="form-control"
            >
                <option value="">Select a budget range</option>
                <option>Under $10,000</option>
                <option>$10,000 - $25,000</option>
                <option>$25,000 - $50,000</option>
                <option>$50,000 - $100,000</option>
                <option>$100,000+</option>
            </select>
        </div>

        <div class="form-group">
            <label for="timeline">Desired Start Time</label>
            <select
                id="timeline"
                name="timeline"
                class="form-control"
            >
                <option value="">Select a timeline</option>
                <option>ASAP</option>
                <option>Within 1 Month</option>
                <option>1–3 Months</option>
                <option>3–6 Months</option>
                <option>Just Planning</option>
            </select>
        </div>

        <div class="form-group">
            <label for="description">
                Describe Your Project *
            </label>
            <textarea
                id="description"
                name="description"
                class="form-control"
                rows="6"
                placeholder="Please describe the renovation work you'd like completed..."
                required
            ></textarea>
        </div>

        <div class="form-group">
            <label for="contact_method">
                Preferred Contact Method
            </label>
            <select
                id="contact_method"
                name="contact_method"
                class="form-control"
            >
                <option>Phone</option>
                <option>Email</option>
                <option>Text Message</option>
            </select>
        </div>

        <div class="form-group">
            <label for="photos">
                Upload Photos or Plans
            </label>
            <input
                type="file"
                id="photos"
                name="photos"
                class="form-control"
                multiple
                accept="image/*,.pdf"
            >
        </div>

        <button type="submit" class="btn btn-primary">
            Request Free Quote
        </button>
    </form>
</div>
